services:
  discord-agent-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-agent-runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REPOS_DIR=/workspace
    volumes:
      # Mount your local projects directory into the container
      # On Windows (PowerShell): ${HOST_WORKSPACE_PATH:-C:/Users/vdkad}:/workspace
      # On Linux/macOS: ${HOST_WORKSPACE_PATH:-$HOME}:/workspace
      - ${HOST_WORKSPACE_PATH:-C:/Users/vdkad}:/workspace
      # Persistent execution log storage on host
      - ./task_logs:/app/task_logs
      # Optional: Mount OpenCode config for credentials
      - ${HOME:-~}/.opencode:/root/.opencode:ro
